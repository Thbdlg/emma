<style>
  :root {
    --ground: #0B1020;
    --ground-2: #0E1526;
    --surface: #16203A;
    --surface-2: #1B2745;
    --line: #253253;
    --line-soft: #1C2740;
    --text: #E8E4DC;
    --muted: #8D9AB8;
    --muted-dim: #5D6883;
    --brass: #E3B25C;
    --brass-deep: #B98B37;
    --brass-dim: #6E5528;
    --rose: #D98A9A;
    --display: "Fraunces", "Iowan Old Style", Georgia, serif;
    --letter: "Spectral", "Palatino Linotype", Palatino, Georgia, serif;
    --ui: "Karla", "Helvetica Neue", Arial, sans-serif;
    --step-0: 0.9375rem;
    --step-1: 1.0625rem;
    --step-2: 1.375rem;
    --step-3: 1.875rem;
    --step-4: clamp(2.25rem, 7vw, 3.25rem);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--text);
    font-family: var(--ui);
    font-size: var(--step-1);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  #ciel-fond {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
  }

  .page {
    position: relative;
    z-index: 1;
    max-width: 44rem;
    margin: 0 auto;
    padding: clamp(2.5rem, 8vw, 5rem) clamp(1.25rem, 5vw, 2rem) 5rem;
    display: flex;
    flex-direction: column;
    gap: 3.5rem;
  }

  /* ---------- En-tete ---------- */

  .entete { display: flex; flex-direction: column; gap: 0.75rem; text-align: center; align-items: center; }

  .surtitre {
    font-family: var(--ui);
    font-size: 0.6875rem;
    font-weight: 700;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--brass-deep);
  }

  .titre {
    font-family: var(--display);
    font-optical-sizing: auto;
    font-weight: 300;
    font-size: var(--step-4);
    line-height: 1.05;
    margin: 0;
    text-wrap: balance;
    color: var(--text);
  }
  .titre em { font-style: italic; font-weight: 500; color: var(--brass); }

  .sous-titre {
    max-width: 30rem;
    margin: 0;
    color: var(--muted);
    font-size: var(--step-0);
    line-height: 1.65;
    text-wrap: balance;
  }

  .compteur {
    display: inline-flex;
    align-items: baseline;
    gap: 0.5rem;
    margin-top: 0.5rem;
    padding: 0.4rem 0.9rem;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: rgba(22, 32, 58, 0.6);
    font-size: 0.8125rem;
    font-variant-numeric: tabular-nums;
    color: var(--muted);
  }
  .compteur b { color: var(--brass); font-weight: 700; }

  /* ---------- Calendrier ---------- */

  .calendrier-bloc { display: flex; flex-direction: column; gap: 1.5rem; }

  .mois-grille {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr));
    gap: 2rem 2.5rem;
  }

  .mois { display: flex; flex-direction: column; gap: 0.75rem; }

  .mois-titre {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin: 0;
    font-family: var(--ui);
    font-size: 0.6875rem;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--brass-deep);
  }
  .mois-titre::after { content: ""; flex: 1; height: 1px; background: var(--line-soft); }

  .grille { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }

  .jour-nom {
    text-align: center;
    font-size: 0.625rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: var(--muted-dim);
    padding-bottom: 0.25rem;
  }

  .case {
    aspect-ratio: 1;
    display: grid;
    place-items: center;
    border-radius: 3px;
    font-family: var(--ui);
    font-size: 0.75rem;
    font-variant-numeric: tabular-nums;
    border: 1px solid transparent;
    background: transparent;
    color: var(--muted-dim);
    padding: 0;
  }

  .case.hors { color: #212B42; }

  button.case { cursor: pointer; transition: transform 140ms ease, background 200ms ease, border-color 200ms ease; }
  button.case:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }

  .case[data-etat="verrou"] { color: var(--muted-dim); border-color: var(--line-soft); }
  .case[data-etat="dispo"] { color: var(--brass); border-color: var(--brass-dim); }
  .case[data-etat="dispo"]:hover { background: rgba(227, 178, 92, 0.10); transform: scale(1.08); }
  .case[data-etat="aujourdhui"] {
    color: #14192B;
    background: var(--brass);
    border-color: var(--brass);
    font-weight: 700;
    box-shadow: 0 0 0 3px rgba(227, 178, 92, 0.16);
  }
  .case[data-etat="ouvert"] {
    color: var(--brass);
    border-color: var(--brass-dim);
    background: rgba(227, 178, 92, 0.16);
    font-weight: 500;
  }
  .case[data-etat="ouvert"]:hover, .case[data-etat="aujourdhui"]:hover { transform: scale(1.08); }
  .case[aria-current="page"] { box-shadow: inset 0 0 0 1px var(--brass); }

  .case.retrouvailles { border-color: var(--rose); color: var(--rose); position: relative; }
  .case.retrouvailles[data-etat="ouvert"], .case.retrouvailles[data-etat="aujourdhui"] {
    background: var(--rose); color: #14192B; border-color: var(--rose);
  }
  .case.retrouvailles::after {
    content: "♥";
    position: absolute;
    top: -3px; right: -1px;
    font-size: 0.5rem;
    color: var(--rose);
  }
  .case.retrouvailles[data-etat="ouvert"]::after, .case.retrouvailles[data-etat="aujourdhui"]::after { color: var(--rose); }

  .ciel-legende {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem 1.5rem;
    justify-content: center;
    font-size: 0.75rem;
    color: var(--muted-dim);
  }
  .ciel-legende span { display: inline-flex; align-items: center; gap: 0.45rem; }
  .puce { width: 11px; height: 11px; border-radius: 2px; flex: none; border: 1px solid transparent; }
  .puce.ouvert { background: rgba(227, 178, 92, 0.16); border-color: var(--brass-dim); }
  .puce.aujourdhui { background: var(--brass); }
  .puce.dispo { border-color: var(--brass-dim); }
  .puce.verrou { border-color: var(--line-soft); }
  .puce.retrouvailles { border-color: var(--rose); }

  /* ---------- Carte du jour ---------- */

  .carte {
    background: linear-gradient(180deg, var(--surface) 0%, var(--ground-2) 100%);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: clamp(1.5rem, 5vw, 2.5rem);
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
    position: relative;
  }

  .carte-entete {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 1rem;
    flex-wrap: wrap;
    padding-bottom: 1.25rem;
    border-bottom: 1px solid var(--line-soft);
  }

  .jour-num {
    font-family: var(--display);
    font-weight: 300;
    font-size: var(--step-3);
    line-height: 1;
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }
  .jour-num span { color: var(--muted-dim); font-size: 0.55em; }

  .etiquette {
    font-size: 0.6875rem;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--brass-deep);
    border: 1px solid var(--brass-dim);
    border-radius: 999px;
    padding: 0.25rem 0.7rem;
  }

  .question {
    font-family: var(--display);
    font-optical-sizing: auto;
    font-weight: 300;
    font-size: var(--step-2);
    line-height: 1.35;
    margin: 0;
    text-wrap: balance;
  }

  .champ { display: flex; gap: 0.6rem; flex-wrap: wrap; }

  input[type="text"] {
    flex: 1 1 12rem;
    min-width: 0;
    background: var(--ground);
    border: 1px solid var(--line);
    border-radius: 3px;
    color: var(--text);
    font-family: var(--ui);
    font-size: var(--step-1);
    padding: 0.7rem 0.9rem;
    transition: border-color 180ms ease;
  }
  input[type="text"]::placeholder { color: var(--muted-dim); }
  input[type="text"]:focus { outline: none; border-color: var(--brass); }

  .btn {
    font-family: var(--ui);
    font-size: 0.875rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 0.7rem 1.4rem;
    border-radius: 3px;
    border: 1px solid var(--brass);
    background: var(--brass);
    color: #14192B;
    cursor: pointer;
    transition: background 180ms ease, color 180ms ease;
  }
  .btn:hover { background: #F0C574; }
  .btn:focus-visible { outline: 2px solid var(--brass); outline-offset: 3px; }

  .btn-fantome {
    background: transparent;
    color: var(--muted);
    border-color: var(--line);
  }
  .btn-fantome:hover { background: var(--surface-2); color: var(--text); }

  .barre-bas { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }

  .aide { font-size: 0.8125rem; color: var(--muted-dim); }

  .indice {
    font-size: 0.875rem;
    color: var(--muted);
    font-style: italic;
    border-left: 2px solid var(--brass-dim);
    padding-left: 0.9rem;
    margin: 0;
  }

  .erreur { color: var(--rose); font-size: 0.875rem; margin: 0; }

  .secousse { animation: secousse 380ms ease; }
  @keyframes secousse {
    10%, 90% { transform: translateX(-2px); }
    20%, 80% { transform: translateX(3px); }
    30%, 50%, 70% { transform: translateX(-5px); }
    40%, 60% { transform: translateX(5px); }
  }

  /* ---------- La lettre ---------- */

  .lettre { display: flex; flex-direction: column; gap: 1.5rem; }

  .sceau {
    display: flex;
    align-items: center;
    gap: 0.85rem;
    font-size: 0.6875rem;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--brass);
  }
  .sceau::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--brass-dim), transparent); }
  .sceau i { font-style: normal; color: var(--rose); font-size: 1rem; letter-spacing: 0; }

  .mot {
    font-family: var(--letter);
    font-weight: 300;
    font-size: 1.25rem;
    line-height: 1.75;
    margin: 0;
    color: #F2EEE6;
    max-width: 34rem;
  }

  .signature {
    font-family: var(--display);
    font-style: italic;
    font-weight: 300;
    font-size: 1.125rem;
    color: var(--brass);
    margin: 0;
    align-self: flex-end;
  }

  .apparait { animation: apparait 800ms cubic-bezier(0.2, 0.7, 0.3, 1) both; }
  .apparait-2 { animation: apparait 800ms cubic-bezier(0.2, 0.7, 0.3, 1) 140ms both; }
  .apparait-3 { animation: apparait 800ms cubic-bezier(0.2, 0.7, 0.3, 1) 320ms both; }
  @keyframes apparait {
    from { opacity: 0; transform: translateY(10px); filter: blur(3px); }
    to   { opacity: 1; transform: none; filter: none; }
  }

  /* ---------- Etats speciaux ---------- */

  .vide {
    text-align: center;
    color: var(--muted);
    font-family: var(--letter);
    font-size: 1.125rem;
    line-height: 1.7;
    margin: 0;
  }

  .pied {
    text-align: center;
    font-size: 0.75rem;
    color: var(--muted-dim);
    letter-spacing: 0.04em;
  }

  .retour {
    background: none;
    border: none;
    color: var(--brass-deep);
    font-family: var(--ui);
    font-size: 0.8125rem;
    cursor: pointer;
    padding: 0;
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  .retour:hover { color: var(--brass); }
  .retour:focus-visible { outline: 2px solid var(--brass); outline-offset: 3px; }

  @media (max-width: 30rem) {
    .grille { gap: 0.4rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
    }
  }
</style>
</head>
<body>
<canvas id="ciel-fond" aria-hidden="true"></canvas>

<main class="page">
  <header class="entete">
    <p class="surtitre" id="surtitre"></p>
    <h1 class="titre" id="titre-page"></h1>
    <p class="sous-titre">Une question par jour. Une bonne reponse, et le mot du jour s ouvre. Tu peux relire les anciens quand tu veux.</p>

  <section class="calendrier-bloc" aria-label="Le calendrier">

      <span><i class="puce verrou"></i> a venir</span>
      <span><i class="puce retrouvailles"></i> retrouvailles</span>
    </div>
  </section>

  <section id="carte-zone" aria-live="polite"></section>

  <p class="pied" id="pied"></p>
</main>

  /* ---------- Chiffrement (miroir exact de build.mjs) ---------- */

  function normaliser(s) {
    return String(s)
      .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
      .toLowerCase()
      .replace(/[^a-z0-9]/g, "");
  }

  function fnv1a(str) {
    var h = 0x811c9dc5;
    for (var i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = (h + ((h << 1) + (h << 4) + (h << 7) + (h << 8) + (h << 24))) >>> 0;
    }
    return h >>> 0;
  }

  function flux(graine, n) {
    var x = graine >>> 0 || 0x9e3779b9;
    var out = new Uint8Array(n);
    for (var i = 0; i < n; i++) {
      x ^= x << 13; x >>>= 0;
      x ^= x >>> 17;
      x ^= x << 5;  x >>>= 0;
      out[i] = (x >>> 24) & 0xff;
    }
    return out;
  }

  function b64versOctets(b64) {
    var bin = atob(b64);
    var out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  function ouvrir(jour, reponse) {
    var n = normaliser(reponse);
    if (!n) return null;
    var empreinte = flux(fnv1a("rep:" + n), 32);
    var chiffre = b64versOctets(jour.c);
    for (var k = 0; k < jour.k.length; k++) {
      var enveloppe = b64versOctets(jour.k[k]);
      var cle = new Uint8Array(32);
      for (var i = 0; i < 32; i++) cle[i] = enveloppe[i] ^ empreinte[i];
      var graine = 0;
      for (var j = 0; j < 32; j++) graine = ((graine * 33) ^ cle[j]) >>> 0;
      var ks = flux(graine, chiffre.length);
      var clair = new Uint8Array(chiffre.length);
      for (var m = 0; m < chiffre.length; m++) clair[m] = chiffre[m] ^ ks[m];
      if (clair[0] === 0x4c && clair[1] === 0x56) {
        return new TextDecoder().decode(clair.subarray(2));
      }
    }
    return null;
  }

  /* ---------- Dates ---------- */

  function ajouterJours(iso, n) {
    var p = iso.split("-");
    var d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
    d.setDate(d.getDate() + n);
    return d;
  }

  function minuit(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }

  function jourCourant() {
    var debut = ajouterJours(DATA.debut, 0);
    var ecart = Math.floor((minuit(new Date()) - minuit(debut)) / 86400000);
    return ecart + 1; // jour 1 = jour du debut
  }

  function dateDuJour(n) {
    return ajouterJours(DATA.debut, n - 1).toLocaleDateString("fr-FR", {
      weekday: "long", day: "numeric", month: "long"
    });
  }

  /* ---------- Memoire ---------- */

  var CLE = "cent-vingt-nuits.v1";
  var memoire = (function () {
    try { return JSON.parse(localStorage.getItem(CLE)) || {}; } catch (e) { return {}; }
  })();

  function sauver() {
    try { localStorage.setItem(CLE, JSON.stringify(memoire)); } catch (e) {}
  }

  function estOuvert(n) { return Object.prototype.hasOwnProperty.call(memoire, n); }

  /* ---------- Etat ---------- */

  var TOTAL = DATA.total;
  var courant = jourCourant();
  var affiche = Math.min(Math.max(courant, 1), TOTAL);
  var essais = 0;

  var THEMES = { maths: "Calcul", logique: "Logique", enigme: "Enigme", culture: "Culture", nous: "Nous deux" };

  function jourParNumero(n) {
    for (var i = 0; i < DATA.jours.length; i++) if (DATA.jours[i].jour === n) return DATA.jours[i];
    return null;
  }

  function etatDe(n) {
    if (n > courant) return "verrou";
    if (estOuvert(n)) return "ouvert";
    if (n === courant) return "aujourdhui";
    return "dispo";
  }

  /* ---------- Rendu du calendrier ---------- */

  var MOIS_NOMS = ["janvier", "fevrier", "mars", "avril", "mai", "juin",
                   "juillet", "aout", "septembre", "octobre", "novembre", "decembre"];
  var JOURS_COURTS = ["L", "M", "M", "J", "V", "S", "D"];

  function dateDe(n) { return ajouterJours(DATA.debut, n - 1); }

  function numeroDe(an, mois, d) {
    return Math.round((new Date(an, mois, d) - minuit(dateDe(1))) / 86400000) + 1;
  }

  function courtDate(d) { return d.getDate() + " " + MOIS_NOMS[d.getMonth()]; }

  function blocMois(an, mois) {
    var bloc = elem("section", "mois");
    bloc.appendChild(elem("h2", "mois-titre", MOIS_NOMS[mois] + " " + an));
    var g = elem("div", "grille");
    for (var i = 0; i < 7; i++) {
      var jn = elem("div", "jour-nom", JOURS_COURTS[i]);
      jn.setAttribute("aria-hidden", "true");
      g.appendChild(jn);
    }
    var decalage = (new Date(an, mois, 1).getDay() + 6) % 7;
    for (var b = 0; b < decalage; b++) g.appendChild(elem("div", "case"));
    var nb = new Date(an, mois + 1, 0).getDate();
    for (var d = 1; d <= nb; d++) {
      var n = numeroDe(an, mois, d);
      if (n < 1 || n > TOTAL) { g.appendChild(elem("div", "case hors", String(d))); continue; }
      var etat = etatDe(n);
      var cell = elem("button", "case" + (n === TOTAL ? " retrouvailles" : ""), String(d));
      cell.type = "button";
      cell.dataset.etat = etat;
      cell.dataset.jour = String(n);
      if (n === affiche) cell.setAttribute("aria-current", "page");
      if (etat === "verrou") cell.disabled = true;
      var suffixe = n === TOTAL ? ", les retrouvailles"
        : etat === "verrou" ? ", pas encore disponible"
        : etat === "ouvert" ? ", deja ouvert" : ", a ouvrir";
      cell.setAttribute("aria-label", "Jour " + n + ", " + d + " " + MOIS_NOMS[mois] + suffixe);
      g.appendChild(cell);
    }
    bloc.appendChild(g);
    return bloc;
  }

  function dessinerCalendrier() {
    var hote = document.getElementById("calendrier");
    hote.textContent = "";
    var d1 = dateDe(1), dN = dateDe(TOTAL);
    var an = d1.getFullYear(), mois = d1.getMonth();
    var anF = dN.getFullYear(), moisF = dN.getMonth();
    while (an < anF || (an === anF && mois <= moisF)) {
      hote.appendChild(blocMois(an, mois));
      mois++;
      if (mois > 11) { mois = 0; an++; }
    }
  }

  /* ---------- Rendu de la carte ---------- */

  function elem(tag, cls, txt) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (txt !== undefined) e.textContent = txt;
    return e;
  }

  function dessinerCarte(anime) {
    var zone = document.getElementById("carte-zone");
    zone.textContent = "";

    if (courant < 1) {
      var att = elem("div", "carte");
      att.appendChild(elem("p", "vide", "Le premier mot s ouvre le " + dateDuJour(1) + ". Reviens ce jour-la."));
      zone.appendChild(att);
      return;
    }

    var j = jourParNumero(affiche);
    if (!j) return;

    var carte = elem("div", "carte");

    var entete = elem("div", "carte-entete");
    var num = elem("div", "jour-num");
    num.appendChild(document.createTextNode(String(affiche)));
    var sur = elem("span", null, " / " + TOTAL);
    num.appendChild(sur);
    entete.appendChild(num);
    var droite = elem("div", null);
    droite.style.display = "flex";
    droite.style.alignItems = "center";
    droite.style.gap = "0.75rem";
    droite.style.flexWrap = "wrap";
    var dateTxt = elem("span", "aide", dateDuJour(affiche));
    droite.appendChild(dateTxt);
    droite.appendChild(elem("span", "etiquette", THEMES[j.theme] || "Question"));
    entete.appendChild(droite);
    carte.appendChild(entete);

    if (estOuvert(affiche)) {
      var lettre = elem("div", "lettre");
      var sceau = elem("div", "sceau");
      var coeur = elem("i", null, "♥");
      sceau.appendChild(coeur);
      sceau.appendChild(document.createTextNode("Le mot du jour"));
      lettre.appendChild(sceau);
      var p = elem("p", "mot", memoire[affiche]);
      lettre.appendChild(p);
      var sig = elem("p", "signature", "— " + (DATA.signature || ""));
      lettre.appendChild(sig);
      if (anime) {
        sceau.classList.add("apparait");
        p.classList.add("apparait-2");
        sig.classList.add("apparait-3");
      }
      carte.appendChild(lettre);
    } else {
      var q = elem("h2", "question", j.question);
      carte.appendChild(q);

      var form = document.createElement("form");
      form.className = "champ";
      var input = document.createElement("input");
      input.type = "text";
      input.autocomplete = "off";
      input.placeholder = "Ta reponse";
      input.setAttribute("aria-label", "Ta reponse");
      var btn = elem("button", "btn", "Ouvrir");
      btn.type = "submit";
      form.appendChild(input);
      form.appendChild(btn);
      carte.appendChild(form);

      var msg = elem("div", null);
      msg.style.display = "flex";
      msg.style.flexDirection = "column";
      msg.style.gap = "0.75rem";
      carte.appendChild(msg);

      var bas = elem("div", "barre-bas");
      var btnIndice = elem("button", "btn btn-fantome", "Un indice");
      btnIndice.type = "button";
      bas.appendChild(btnIndice);
      var compte = elem("span", "aide", estOuvert(affiche) ? "" : (affiche === courant ? "Question du jour" : "Jour en retard, tu peux le rattraper"));
      bas.appendChild(compte);
      carte.appendChild(bas);

      btnIndice.addEventListener("click", function () {
        if (msg.querySelector(".indice")) return;
        var ind = elem("p", "indice", j.indice);
        msg.appendChild(ind);
      });

      form.addEventListener("submit", function (ev) {
        ev.preventDefault();
        var val = input.value;
        if (!normaliser(val)) return;
        var clair = ouvrir(j, val);
        if (clair) {
          memoire[affiche] = clair;
          sauver();
          essais = 0;
          dessinerCalendrier();
          dessinerCarte(true);
          majCompteur();
        } else {
          essais++;
          var vieille = msg.querySelector(".erreur");
          if (vieille) vieille.remove();
          var textes = ["Pas tout a fait. Reessaie.", "Toujours pas. Tu veux un indice ?", "Non plus. L indice est juste en dessous."];
          msg.insertBefore(elem("p", "erreur", textes[Math.min(essais - 1, 2)]), msg.firstChild);
          input.classList.remove("secousse");
          void input.offsetWidth;
          input.classList.add("secousse");
          if (essais >= 2 && !msg.querySelector(".indice")) {
            msg.appendChild(elem("p", "indice", j.indice));
          }
          input.select();
        }
      });

      setTimeout(function () { input.focus({ preventScroll: true }); }, 60);
    }

    if (affiche !== courant && courant >= 1 && courant <= TOTAL) {
      var retour = elem("button", "retour", "Revenir au jour d aujourd hui");
      retour.type = "button";
      retour.addEventListener("click", function () {
        affiche = Math.min(courant, TOTAL);
        essais = 0;
        dessinerCalendrier();
        dessinerCarte(false);
      });
      carte.appendChild(retour);
    }

    zone.appendChild(carte);
  }

  /* ---------- Compteur & pied ---------- */

  function majCompteur() {
    var ouverts = 0;
    for (var i = 1; i <= TOTAL; i++) if (estOuvert(i)) ouverts++;
    var restants = Math.max(0, TOTAL - Math.min(Math.max(courant, 0), TOTAL));
    var el = document.getElementById("compteur");
    el.textContent = "";
    if (courant < 1) {
      el.appendChild(document.createTextNode("Le compte a rebours n a pas encore commence"));
    } else if (courant > TOTAL) {
      el.appendChild(document.createTextNode("C est fini. "));
      var b0 = document.createElement("b");
      b0.textContent = ouverts + " mots";
      el.appendChild(b0);
      el.appendChild(document.createTextNode(" ouverts."));
    } else {
      var b1 = document.createElement("b");
      b1.textContent = "Jour " + courant;
      el.appendChild(b1);
      el.appendChild(document.createTextNode(" sur " + TOTAL + " · "));
      var b2 = document.createElement("b");
      b2.textContent = String(restants);
      el.appendChild(b2);
      el.appendChild(document.createTextNode(" restants · " + ouverts + " ouverts"));
    }
    document.getElementById("pied").textContent = "Une case de plus chaque jour, jusqu au " + courtDate(dateDe(TOTAL)) + ".";
  }

  /* ---------- Fond etoile ---------- */

  function fondEtoile() {
    var c = document.getElementById("ciel-fond");
    var ctx = c.getContext("2d");
    var reduit = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var etoiles = [];
    var dpr = Math.min(window.devicePixelRatio || 1, 2);

    function semer() {
      c.width = c.clientWidth * dpr;
      c.height = c.clientHeight * dpr;
      var n = Math.round((c.clientWidth * c.clientHeight) / 9000);
      etoiles = [];
      for (var i = 0; i < n; i++) {
        etoiles.push({
          x: Math.random() * c.width,
          y: Math.random() * c.height,
          r: (Math.random() * 1.1 + 0.3) * dpr,
          a: Math.random() * 0.5 + 0.12,
          v: (Math.random() * 0.5 + 0.15) * dpr * 0.04,
          p: Math.random() * Math.PI * 2
        });
      }
    }

    function peindre(t) {
      ctx.clearRect(0, 0, c.width, c.height);
      for (var i = 0; i < etoiles.length; i++) {
        var e = etoiles[i];
        var scin = reduit ? 1 : 0.65 + 0.35 * Math.sin(t / 1400 + e.p);
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(227, 200, 150, " + (e.a * scin).toFixed(3) + ")";
        ctx.fill();
        if (!reduit) {
          e.y -= e.v;
          if (e.y < -2) { e.y = c.height + 2; e.x = Math.random() * c.width; }
        }
      }
      if (!reduit) requestAnimationFrame(peindre);
    }

    semer();
    requestAnimationFrame(peindre);
    var minuteur;
    window.addEventListener("resize", function () {
      clearTimeout(minuteur);
      minuteur = setTimeout(function () { semer(); if (reduit) peindre(0); }, 200);
    });
  }

  /* ---------- Demarrage ---------- */

  (function entete() {
    var d1 = dateDe(1), dF = dateDe(TOTAL);
    document.getElementById("surtitre").textContent =
      courtDate(d1) + " — " + courtDate(dF) + " · " + TOTAL + " jours";
    var h1 = document.getElementById("titre-page");
    h1.textContent = "Jusqu au " + courtDate(dF) + ",";
    h1.appendChild(document.createElement("br"));
    var em = document.createElement("em");
    em.textContent = DATA.prenom;
    h1.appendChild(em);
    document.title = "Jusqu au " + courtDate(dF);
  })();

  document.getElementById("calendrier").addEventListener("click", function (ev) {
    var b = ev.target.closest("button.case");
    if (!b || b.disabled) return;
    affiche = Number(b.dataset.jour);
    essais = 0;
    dessinerCalendrier();
    dessinerCarte(false);
    document.getElementById("carte-zone").scrollIntoView({ behavior: "smooth", block: "center" });
  });

  dessinerCalendrier();
  dessinerCarte(false);
  majCompteur();
  fondEtoile();
})();
</script>
</body>
</html>
